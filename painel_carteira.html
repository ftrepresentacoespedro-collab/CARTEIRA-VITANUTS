<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carteira Parada — Vitanuts</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root {
  --color-bg: #161826;
  --color-surface: #232532;
  --color-text: #e9e9ed;
  --color-accent: #9184d9;
  --color-accent-2: #a7a1db;
  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);
  --color-red: #e2685f;
  --color-red-bg: rgba(226, 104, 95, 0.14);
  --color-amber: #e0b355;
  --color-amber-bg: rgba(224, 179, 85, 0.14);
  --color-green: #6fcf97;
  --color-green-bg: rgba(111, 207, 151, 0.14);
  --font: "Inter", system-ui, sans-serif;
  --radius: 8px;
}
* , *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font); font-size: 13.5px; line-height: 1.5; }
h1 { font-size: 22px; font-weight: 600; margin: 0; }
h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
p { margin: 0; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
.nav { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--color-divider); margin-bottom: 18px; flex-wrap: wrap; }
.aviso { background: var(--color-amber-bg); border: 1px solid var(--color-amber); color: var(--color-amber); border-radius: var(--radius); padding: 10px 14px; font-size: 12.5px; margin-bottom: 18px; }
.section { margin-bottom: 28px; }
.section-divider { border-top: 1px solid var(--color-divider); padding-top: 24px; margin-top: 4px; }
.card { background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 12px; padding: 16px; }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 16px; }
.kpi { background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: var(--radius); padding: 12px 14px; }
.kpi .label { font-size: 11px; color: color-mix(in srgb, var(--color-text) 60%, transparent); margin-bottom: 4px; }
.kpi .value { font-size: 19px; font-weight: 600; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; font-weight: 500; color: color-mix(in srgb, var(--color-text) 60%, transparent); font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; padding: 8px 10px; border-bottom: 1px solid var(--color-divider); }
th.th-ordenavel { cursor: pointer; user-select: none; white-space: nowrap; }
th.th-ordenavel:hover { color: var(--color-text); }
td { padding: 8px 10px; border-bottom: 1px solid color-mix(in srgb, var(--color-divider) 60%, transparent); vertical-align: top; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.destaque td { background: var(--color-red-bg); }
.tag { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
.tag-red { background: var(--color-red-bg); color: var(--color-red); }
.tag-amber { background: var(--color-amber-bg); color: var(--color-amber); }
.tag-green { background: var(--color-green-bg); color: var(--color-green); }
.tag-neutral { background: color-mix(in srgb, var(--color-text) 12%, transparent); color: var(--color-text); }
.muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
.field { display: inline-flex; align-items: center; gap: 6px; }
input[type=number] { width: 60px; background: var(--color-bg); border: 1px solid var(--color-divider); color: var(--color-text); border-radius: 6px; padding: 4px 6px; font-family: var(--font); }
input[type=password] { background: var(--color-bg); border: 1px solid var(--color-divider); color: var(--color-text); border-radius: 6px; padding: 8px 10px; font-family: var(--font); width: 220px; }
.btn { cursor: pointer; border: 1px solid var(--color-accent); color: var(--color-accent); background: transparent; padding: 7px 14px; border-radius: 6px; font-family: var(--font); font-weight: 500; font-size: 12.5px; }
.btn:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }
.login-box { max-width: 320px; margin: 80px auto; text-align: center; }
.section-sub { font-size: 12px; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 10px; }
.scroll-x { overflow-x: auto; }
.badge-visitantes { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: color-mix(in srgb, var(--color-text) 60%, transparent); }
.badge-visitantes .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-green); display: inline-block; }
.topico { border: 1px solid var(--color-divider); border-radius: 10px; margin-bottom: 8px; overflow: hidden; background: var(--color-surface); }
.topico-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 16px; cursor: pointer; }
.topico-header:hover { background: color-mix(in srgb, var(--color-accent) 8%, transparent); }
.topico-header h2 { font-size: 14px; }
.topico-chevron { color: var(--color-accent); font-size: 13px; transition: transform 0.15s ease; flex-shrink: 0; }
.topico-chevron.aberto { transform: rotate(90deg); }
.topico-corpo { padding: 4px 16px 18px; border-top: 1px solid var(--color-divider); }
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
// ================== CONFIGURAÇÃO ==================
const API_URL = "https://script.google.com/macros/s/AKfycbxExdJYeuzI0hkS9aT6JBqZxy1NkYPMUIfFVnKwYWGoiCScz52o4jZMdUwLlFxmmLRKEg/exec";
const INTERVALO_HEARTBEAT_MS = 45000;
// ====================================================
function getSenhaSalva(){ return sessionStorage.getItem('carteira_senha') || ''; }
function salvarSenha(s){ sessionStorage.setItem('carteira_senha', s); }
function getDeviceId(){
  let id = localStorage.getItem('carteira_device_id');
  if(!id){
    id = 'dev_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('carteira_device_id', id);
  }
  return id;
}
function brl(v){ return 'R$ ' + (Number(v)||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function pct(v){ return v === null || v === undefined ? '—' : (v*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%'; }
function fmtData(d){ if(!d) return '—'; const [a,m,dia] = d.split('-'); return dia+'/'+m+'/'+a; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function buscarViaJsonpUmaVez_(url, params){
  return new Promise((resolve) => {
    const nomeCallback = 'jsonp_' + Date.now() + '_' + Math.floor(Math.random()*100000);
    const script = document.createElement('script');
    window[nomeCallback] = (resposta) => { delete window[nomeCallback]; script.remove(); resolve(resposta); };
    script.onerror = () => { delete window[nomeCallback]; script.remove(); resolve({erro:'falha_de_rede'}); };
    script.src = url + '?' + params + '&callback=' + nomeCallback + '&_=' + Date.now();
    document.body.appendChild(script);
  });
}
// Falha de rede aqui costuma ser soluço transitório de conexão (perdia
// de pacote, timeout momentâneo) — na prática, recarregar a página
// quase sempre resolve. Em vez de fazer a pessoa apertar F5 na mão,
// tenta de novo sozinho (até 2 vezes, com uma pausa curta) antes de
// mostrar erro de verdade.
async function buscarViaJsonp(url, params){
  const MAX_TENTATIVAS = 3;
  for (let tentativa = 1; tentativa <= MAX_TENTATIVAS; tentativa++) {
    const resposta = await buscarViaJsonpUmaVez_(url, params);
    if (resposta.erro !== 'falha_de_rede') return resposta;
    if (tentativa < MAX_TENTATIVAS) await new Promise(r => setTimeout(r, 800 * tentativa));
  }
  return { erro: 'falha_de_rede' };
}
function renderLogin(erro){
  document.getElementById('app').innerHTML = `
    <div class="login-box">
      <h1 style="margin-bottom:16px;">Carteira Parada — Vitanuts</h1>
      ${erro ? '<p class="tag tag-red" style="display:inline-block;margin-bottom:12px;">Senha incorreta</p><br>' : ''}
      <input type="password" id="senhaInput" placeholder="Senha" autofocus style="margin-bottom:10px;">
      <br><button class="btn" id="btnEntrar">Entrar</button>
    </div>`;
  document.getElementById('btnEntrar').addEventListener('click', tentarLogin);
  document.getElementById('senhaInput').addEventListener('keydown', e => { if(e.key === 'Enter') tentarLogin(); });
}
async function tentarLogin(){
  const senha = document.getElementById('senhaInput').value;
  await carregarDados(senha);
}
let dados = null;
let heartbeatIniciado = false;
let visitantesInfo = { vendo_agora: 0, unicos: 0 };
async function carregarDados(senha){
  const resp = await buscarViaJsonp(API_URL, 'senha=' + encodeURIComponent(senha));
  if(resp.erro === 'senha_incorreta'){ renderLogin(true); return; }
  if(resp.erro){ document.getElementById('app').innerHTML = '<div class="wrap"><p class="tag tag-red">Erro ao carregar: ' + escapeHtml(resp.erro) + '</p></div>'; return; }
  salvarSenha(senha);
  dados = resp;
  render();
  iniciarHeartbeat();
}
async function atualizarImposto(novoPct){
  const senha = getSenhaSalva();
  await buscarViaJsonp(API_URL, 'senha=' + encodeURIComponent(senha) + '&acao=definir_imposto&valor=' + encodeURIComponent(novoPct));
  await carregarDados(senha);
}
// Contador de "vendo agora" / "únicos" — independente do painel
// principal, próprio arquivo no Drive. Um heartbeat imediato ao
// carregar e depois a cada 45s enquanto a aba ficar aberta.
function iniciarHeartbeat(){
  if(heartbeatIniciado) return;
  heartbeatIniciado = true;
  enviarHeartbeat();
  setInterval(enviarHeartbeat, INTERVALO_HEARTBEAT_MS);
}
async function enviarHeartbeat(){
  const senha = getSenhaSalva();
  if(!senha) return;
  const resp = await buscarViaJsonp(API_URL, 'senha=' + encodeURIComponent(senha) + '&acao=heartbeat&device=' + encodeURIComponent(getDeviceId()));
  if(resp && resp.ok){
    visitantesInfo = { vendo_agora: resp.vendo_agora, unicos: resp.unicos };
    atualizarBadgeVisitantes();
  }
}
function atualizarBadgeVisitantes(){
  const el = document.getElementById('badgeVisitantes');
  if(el) el.innerHTML = '<span class="dot"></span>' + visitantesInfo.vendo_agora + ' vendo agora · ' + visitantesInfo.unicos + ' únicos';
}
let clientesFiltroTexto = '';
let clientesMostrarTodos = false;
const CLIENTES_LIMITE_PADRAO = 30;
// Ordenação clicável das tabelas de pedidos parados — null = ordem
// original que vem do backend ("prioridade por valor"). Cada canal
// (b2b/b2c) tem seu próprio estado porque são duas tabelas independentes
// na tela. Primeiro clique numa coluna ordena decrescente (mais novo,
// mais tempo parado, maior valor, maior prazo primeiro — o que costuma
// ser mais útil de bater o olho primeiro); clique de novo na mesma
// coluna inverte pra crescente.
let ordenacaoPedidos = { b2b: null, b2c: null };
let topicosAbertos = new Set(); // vazio = tudo recolhido por padrão
// Mapa tópico -> nome da seção pesada que ele precisa (bate com
// SECOES_DISPONIVEIS no backend). Tópico que não está aqui (kpi-b2c,
// margem-b2c) já vem pronto no resumo enxuto, não precisa buscar nada.
const SECAO_POR_TOPICO = {
  'pedidos-b2b': 'pedidos_parados',
  'produtos-b2b': 'produtos_parados',
  'estoque': 'estoque',
  'comprar-b2b': 'projecao',
  'clientes-b2b': 'clientes',
  'pedidos-b2c': 'pedidos_parados_b2c',
  'produtos-b2c': 'produtos_parados_b2c',
  'comprar-b2c': 'projecao_b2c',
};
function renderTopico(key, titulo, corpoHtml){
  const aberto = topicosAbertos.has(key);
  return `
    <div class="topico">
      <div class="topico-header" data-topico="${key}">
        <h2>${titulo}</h2>
        <span class="topico-chevron${aberto ? ' aberto' : ''}">▸</span>
      </div>
      <div class="topico-corpo" data-topico-corpo="${key}" style="display:${aberto ? 'block' : 'none'};">
        ${corpoHtml}
      </div>
    </div>`;
}
// Busca a seção pesada de um tópico específico e mescla no `dados`
// global. Não substitui o objeto inteiro — só adiciona os campos que
// vieram na resposta, preservando o que já foi carregado antes.
async function carregarSecao_(secaoNome){
  const senha = getSenhaSalva();
  const resp = await buscarViaJsonp(API_URL, 'senha=' + encodeURIComponent(senha) + '&secao=' + encodeURIComponent(secaoNome));
  if(resp.erro) return false;
  Object.assign(dados, resp);
  return true;
}
function ligarTopicos(){
  document.querySelectorAll('.topico-header').forEach(header => {
    header.addEventListener('click', async () => {
      const key = header.getAttribute('data-topico');
      const corpo = document.querySelector('.topico-corpo[data-topico-corpo="'+key+'"]');
      const chevron = header.querySelector('.topico-chevron');
      const aberto = topicosAbertos.has(key);
      if(aberto){
        topicosAbertos.delete(key); corpo.style.display = 'none'; chevron.classList.remove('aberto');
        return;
      }
      topicosAbertos.add(key); corpo.style.display = 'block'; chevron.classList.add('aberto');
      const secaoNome = SECAO_POR_TOPICO[key];
      if(secaoNome && dados[secaoNome] === undefined){
        corpo.innerHTML = '<p class="muted" style="padding:12px 0;">Carregando...</p>';
        const ok = await carregarSecao_(secaoNome);
        if(!ok){ corpo.innerHTML = '<p class="tag tag-red">Não consegui carregar essa seção. Tenta fechar e abrir de novo.</p>'; return; }
        render(); // topicosAbertos já tem essa chave — reabre já com o conteúdo pronto
      }
    });
  });
}
// Se algum tópico ficou marcado como aberto (ex: você tinha aberto
// "Pedidos parados B2B" e depois salvou um imposto novo, que recarrega
// o resumo enxuto do zero) mas o dado pesado dele não está mais em
// `dados`, busca de novo sozinho — sem isso, o tópico reabriria vazio
// até você fechar e abrir de novo manualmente.
async function garantirSecoesAbertasCarregadas(){
  let precisouRenderizarDeNovo = false;
  for(const key of topicosAbertos){
    const secaoNome = SECAO_POR_TOPICO[key];
    if(secaoNome && dados[secaoNome] === undefined){
      const ok = await carregarSecao_(secaoNome);
      if(ok) precisouRenderizarDeNovo = true;
    }
  }
  if(precisouRenderizarDeNovo) render();
}
// Extrai um número de dias representativo do texto de prazo_pagamento
// ("30/45 dias" -> 45, "À vista" -> 0, sem prazo -> null) pra dar pra
// ordenar a coluna "Prazo pagto" — usa o MAIOR número de cada pedido
// (parcela mais distante), que é o que mais importa pra enxergar risco
// de prazo longo.
function prazoOrdenavel_(p){
  const texto = p.prazo_pagamento;
  if(!texto) return null;
  if(texto === 'À vista') return 0;
  const nums = (texto.match(/\d+/g) || []).map(Number);
  return nums.length ? Math.max(...nums) : null;
}
// Aplica a ordenação clicável (ver ordenacaoPedidos) sobre uma lista de
// pedidos — null/ordenacao ausente devolve a lista como veio do backend
// (já em "prioridade por valor"). Pedido sem valor pro campo escolhido
// (ex: sem prazo calculado) vai pro final, não importa a direção.
function ordenarPedidos_(pedidos, ordenacao){
  if(!ordenacao || !ordenacao.campo) return pedidos;
  const { campo, direcao } = ordenacao;
  const mult = direcao === 'asc' ? 1 : -1;
  const valorDe = p => {
    if(campo === 'data') return p.data_pedido || null;
    if(campo === 'dias_parado') return p.dias_parado ?? null;
    if(campo === 'valor') return p.valor ?? null;
    if(campo === 'prazo') return prazoOrdenavel_(p);
    return null;
  };
  return [...pedidos].sort((a,b) => {
    const va = valorDe(a), vb = valorDe(b);
    if(va === null && vb === null) return 0;
    if(va === null) return 1;  // sem valor sempre por último
    if(vb === null) return -1;
    if(va < vb) return -1 * mult;
    if(va > vb) return 1 * mult;
    return 0;
  });
}
// Cabeçalho clicável de coluna ordenável — mostra ▲/▼ quando é a coluna
// ativa da ordenação. O clique de verdade é ligado depois via
// ligarOrdenacaoPedidos (mesmo padrão de ligarExpansaoPedidos), não
// inline, pra não misturar onclick com o resto do código.
function thOrdenavel_(rotulo, campo, prefixo, ordenacao, classeExtra){
  const ativo = ordenacao && ordenacao.campo === campo;
  const seta = ativo ? (ordenacao.direcao === 'asc' ? ' ▲' : ' ▼') : '';
  return `<th class="th-ordenavel ${classeExtra||''}" data-ordenar="${campo}" data-prefixo="${prefixo}">${rotulo}${seta}</th>`;
}
// Gera as duas tabelas de pedidos parados (linhas + expansão de itens)
// reaproveitando o mesmo HTML pra B2B e B2C, mudando só o prefixo do
// data-idx pra não colidir índice entre os dois canais.
// Coluna "Prazo pagto" mostra dados.prazo_pagamento (texto tipo
// "30/60 dias" ou "À vista", calculado no backend a partir das
// parcelas do pedido — ver ressalva sobre confiabilidade no cabeçalho
// do Code_Carteira.gs). "—" quando o backend não conseguiu calcular
// (pedido sem parcela reconhecida). Data, Dias parado, Valor e Prazo
// pagto são ordenáveis clicando no cabeçalho (ver ordenacaoPedidos).
function tabelaPedidosHtml(pedidos, comparacaoIsolado, prefixo){
  const ordenacao = ordenacaoPedidos[prefixo];
  const pedidosOrdenados = ordenarPedidos_(pedidos, ordenacao);
  return `
    <table>
      <thead><tr><th></th><th>Pedido</th><th>Cliente</th>${thOrdenavel_('Data','data',prefixo,ordenacao)}${thOrdenavel_('Dias parado','dias_parado',prefixo,ordenacao,'num')}${thOrdenavel_('Valor','valor',prefixo,ordenacao,'num')}${thOrdenavel_('Prazo pagto','prazo',prefixo,ordenacao)}<th class="num">Margem</th>${comparacaoIsolado ? '<th>Estoque hoje</th>' : ''}</tr></thead>
      <tbody>
        ${pedidosOrdenados.map((p,i) => {
          const isolado = comparacaoIsolado ? comparacaoIsolado.find(x=>x.pedido_id===p.id) : null;
          const atende = isolado ? isolado.atende_isolado : null;
          const itensHtml = (p.itens||[]).map(it => `<div style="padding:3px 0;font-size:12px;">${escapeHtml(it.nome)} <span class="muted">(${escapeHtml(it.sku)})</span> — <span class="num">${it.quantidade} un</span></div>`).join('');
          return `<tr class="${p.destaque_90_dias?'destaque':''} linha-pedido-${prefixo}" data-idx="${i}" style="cursor:pointer;">
            <td class="expand-icon" style="width:16px;color:var(--color-accent);">▸</td>
            <td>#${escapeHtml(p.numero)}</td>
            <td>${escapeHtml(p.cliente)}</td>
            <td>${fmtData(p.data_pedido)}</td>
            <td class="num">${p.dias_parado ?? '—'}</td>
            <td class="num">${brl(p.valor)}</td>
            <td>${p.prazo_pagamento ? escapeHtml(p.prazo_pagamento) : '<span class="muted">—</span>'}</td>
            <td class="num">${p.margem_indisponivel_item_sem_custo ? '<span class="tag tag-amber">sem custo cadastrado</span>' : pct(p.margem_pct)}</td>
            ${comparacaoIsolado ? `<td>${atende===null?'<span class="muted">—</span>':(atende?'<span class="tag tag-green">atende</span>':'<span class="tag tag-red">falta item</span>')}</td>` : ''}
          </tr>
          <tr class="itens-pedido-${prefixo}" data-parent="${i}" style="display:none;"><td></td><td colspan="${comparacaoIsolado ? 8 : 7}" style="padding:8px 0 12px 24px;">${itensHtml}</td></tr>`;
        }).join('')}
      </tbody>
    </table>`;
}
function tabelaProdutosParadosHtml(produtos){
  return `
    <table>
      <thead><tr><th>SKU</th><th>Produto</th><th class="num">Qtd. presa</th><th class="num">Valor</th><th class="num">Pedidos</th></tr></thead>
      <tbody>
        ${produtos.map(p => `<tr>
          <td>${escapeHtml(p.sku)}</td><td>${escapeHtml(p.nome)}</td>
          <td class="num">${p.quantidade}</td><td class="num">${brl(p.valor)}</td><td class="num">${p.pedidos}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}
function ligarExpansaoPedidos(prefixo){
  document.querySelectorAll('.linha-pedido-' + prefixo).forEach(tr => {
    tr.addEventListener('click', () => {
      const idx = tr.getAttribute('data-idx');
      const corpo = document.querySelector('.itens-pedido-' + prefixo + '[data-parent="'+idx+'"]');
      const icone = tr.querySelector('.expand-icon');
      const aberto = corpo.style.display !== 'none';
      corpo.style.display = aberto ? 'none' : '';
      icone.textContent = aberto ? '▸' : '▾';
    });
  });
}
// Clique num cabeçalho ordenável (Data / Dias parado / Valor / Prazo
// pagto): primeiro clique numa coluna nova ordena decrescente; clique
// de novo na mesma coluna alterna pra crescente e vice-versa. Reaplica
// render() inteiro — mais simples que re-renderizar só a tabela, e o
// custo é desprezível (é tudo dado que já está em memória).
function ligarOrdenacaoPedidos(prefixo){
  document.querySelectorAll('.th-ordenavel[data-prefixo="' + prefixo + '"]').forEach(th => {
    th.addEventListener('click', () => {
      const campo = th.getAttribute('data-ordenar');
      const atual = ordenacaoPedidos[prefixo];
      ordenacaoPedidos[prefixo] = (atual && atual.campo === campo)
        ? { campo, direcao: atual.direcao === 'desc' ? 'asc' : 'desc' }
        : { campo, direcao: 'desc' };
      render();
    });
  });
}
function render(){
  if(!dados){ document.getElementById('app').innerHTML = '<p class="muted">Sem dados ainda.</p>'; return; }
  const contagens = dados.contagens || {};
  const projResumo = dados.projecao_resumo || {};
  const projB2CResumo = dados.projecao_b2c_resumo || {};
  const margem = dados.margem || {};
  const margemB2C = dados.margem_b2c || {};
  const margemCombinada = dados.margem_combinada || {};
  const cB2B = dados.carteira_b2b || {qtd:0,valor:0};
  const cB2C = dados.carteira_b2c || {qtd:0,valor:0};
  const cGeral = dados.carteira_geral || {qtd:0,valor:0};
  // Cada uma dessas só existe em `dados` depois que o tópico correspondente
  // foi aberto pelo menos uma vez (busca sob demanda) — daí o "carregado".
  const pedidosCarregado = dados.pedidos_parados !== undefined;
  const pedidos = dados.pedidos_parados || [];
  const produtosCarregado = dados.produtos_parados !== undefined;
  const produtos = dados.produtos_parados || [];
  const estoqueCarregado = dados.estoque !== undefined;
  const estoque = dados.estoque || [];
  const projCarregado = dados.projecao !== undefined;
  const proj = dados.projecao || {};
  const clientesCarregado = dados.clientes !== undefined;
  const clientesTodos = dados.clientes || [];
  const pedidosB2CCarregado = dados.pedidos_parados_b2c !== undefined;
  const pedidosB2C = dados.pedidos_parados_b2c || [];
  const produtosB2CCarregado = dados.produtos_parados_b2c !== undefined;
  const produtosB2C = dados.produtos_parados_b2c || [];
  const projB2CCarregado = dados.projecao_b2c !== undefined;
  const projB2C = dados.projecao_b2c || {};
  const carregandoHtml = '<p class="muted" style="padding:12px 0;">Carregando...</p>';
  // Clientes: positivados sempre primeiro (mais recentes primeiro), "sem compras" depois
  const clientesOrdenados = [...clientesTodos].sort((a,b) => {
    if(a.status==='positivado' && b.status!=='positivado') return -1;
    if(a.status!=='positivado' && b.status==='positivado') return 1;
    if(a.status==='positivado') return (a.dias_sem_comprar||0) - (b.dias_sem_comprar||0);
    return (a.nome||'').localeCompare(b.nome||'');
  });
  const filtroLower = clientesFiltroTexto.trim().toLowerCase();
  const clientesFiltrados = filtroLower
    ? clientesOrdenados.filter(c => (c.nome||'').toLowerCase().includes(filtroLower) || (c.cnpj||'').includes(filtroLower.replace(/\D/g,'')))
    : clientesOrdenados;
  const clientesExibidos = clientesMostrarTodos ? clientesFiltrados : clientesFiltrados.slice(0, CLIENTES_LIMITE_PADRAO);
  // Indicadores/margem B2B usam só o resumo enxuto (contagens,
  // projecao_resumo) — nunca precisam de busca sob demanda.
  const corpoKpiB2B = `
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Pedidos parados (B2B)</div><div class="value">${contagens.pedidos_parados||0}</div></div>
      <div class="kpi"><div class="label">Parados há mais de ${dados.destaque_dias||90} dias</div><div class="value" style="color:var(--color-red);">${contagens.pedidos_parados_destaque||0}</div></div>
      <div class="kpi"><div class="label">Clientes positivados (B2B, cód 0)</div><div class="value">${dados.clientes_positivados_qtd||0} / ${(dados.clientes_positivados_qtd||0)+(dados.clientes_sem_compra_qtd||0)}</div></div>
      <div class="kpi"><div class="label">Atende com estoque restante</div><div class="value" style="color:var(--color-green);">${brl(projResumo.valor_atende_sem_comprar)}</div></div>
      <div class="kpi"><div class="label">Depende de reposição</div><div class="value" style="color:var(--color-amber);">${brl(projResumo.valor_depende_reposicao)}</div></div>
    </div>`;
  const corpoMargemB2B = `
    <div style="display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
      <div class="field">
        <label for="impostoInput" class="muted" style="font-size:11.5px;">Imposto %</label>
        <input type="number" id="impostoInput" value="${dados.imposto_pct}" min="0" max="100" step="0.5">
        <button class="btn" id="btnSalvarImposto">Salvar</button>
      </div>
    </div>
    <div class="card">
      <p>Margem geral: <strong style="font-size:16px;">${pct(margem.pct_geral)}</strong> <span class="muted">sobre ${brl(margem.valor_base_calculo)} em pedidos com custo completo</span></p>
      ${margem.qtd_pedidos_excluidos_sem_custo > 0 ? `<p class="tag tag-amber" style="margin-top:8px;">${margem.qtd_pedidos_excluidos_sem_custo} pedido(s) com item fora da tabela de custo — excluído(s) deste cálculo</p>` : ''}
      <p class="muted" style="font-size:11px;margin-top:8px;">O imposto % vale para B2B e B2C juntos — mudar aqui também recalcula a margem B2C.</p>
    </div>`;
  const corpoPedidosB2B = !pedidosCarregado ? carregandoHtml : `
    <p class="section-sub">Em digitação + Em aberto, últimos ${dados.janela_dias||180} dias. Linhas destacadas: parado há mais de ${dados.destaque_dias||90} dias. Clique num pedido pra ver os produtos.</p>
    <div class="card scroll-x">${tabelaPedidosHtml(pedidos, dados.comparacao_isolado || [], 'b2b')}</div>`;
  const corpoProdutosB2B = !produtosCarregado ? carregandoHtml : `
    <p class="section-sub">SKUs presos nos pedidos em aberto/digitação acima</p>
    <div class="card scroll-x">${tabelaProdutosParadosHtml(produtos)}</div>`;
  const corpoEstoque = !estoqueCarregado ? carregandoHtml : `
    <p class="section-sub">Só os SKUs cadastrados na tabela de custo — ${estoque.filter(e=>e.saldo===null).length>0?'<span class="tag tag-amber">alguns sem saldo confirmado, ver nota abaixo</span>':'todos com saldo lido do Bling'}. Esse saldo é físico e compartilhado entre B2B e B2C.</p>
    <div class="card scroll-x">
      <table>
        <thead><tr><th>SKU</th><th>Produto</th><th class="num">Saldo</th></tr></thead>
        <tbody>
          ${estoque.map(e => `<tr><td>${escapeHtml(e.sku)}</td><td>${escapeHtml(e.nome)}</td><td class="num">${e.saldo===null?'<span class="tag tag-amber">não confirmado</span>':e.saldo}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  const corpoComprarB2B = !projCarregado ? carregandoHtml : `
    <p class="section-sub">Considerando a fila de prioridade (maior valor primeiro) esgotando o estoque que sobrou depois do B2C já ter alocado a dele (o B2C tem prioridade — ver tópicos B2C).</p>
    <div class="card scroll-x">
      <table>
        <thead><tr><th>SKU</th><th>Produto</th><th class="num">Qtd. a comprar</th><th class="num">Custo estimado</th></tr></thead>
        <tbody>
          ${(proj.lista_comprar||[]).length===0 ? '<tr><td colspan="4" class="muted">Nada a comprar — estoque cobre toda a carteira parada.</td></tr>' :
            (proj.lista_comprar||[]).map(i => `<tr><td>${escapeHtml(i.sku)}</td><td>${escapeHtml(i.nome)}</td><td class="num">${i.quantidade_faltante}</td><td class="num">${brl(i.custo_estimado)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  const corpoClientesB2B = !clientesCarregado ? carregandoHtml : `
    <p class="section-sub">Base fixa de ${clientesTodos.length} clientes. Última compra = pedido em aberto/digitação OU nota fiscal, o que for mais recente. Positivados aparecem primeiro.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;">
      <input type="text" id="clientesBusca" placeholder="Buscar por nome ou CNPJ..." value="${escapeHtml(clientesFiltroTexto)}" style="flex:1;min-width:200px;background:var(--color-surface);border:1px solid var(--color-divider);color:var(--color-text);border-radius:6px;padding:8px 10px;font-family:inherit;">
      <span class="muted" style="font-size:11.5px;">${clientesFiltrados.length} cliente(s)</span>
    </div>
    <div class="card scroll-x">
      <table>
        <thead><tr><th>Cliente</th><th>CNPJ</th><th>Cidade/UF</th><th>Status</th><th>Última atividade</th><th class="num">Dias sem comprar</th></tr></thead>
        <tbody>
          ${clientesExibidos.map(c => `<tr>
            <td>${escapeHtml(c.nome)}</td>
            <td class="muted" style="font-size:11.5px;">${escapeHtml(c.cnpj)}</td>
            <td>${escapeHtml(c.cidade)}/${escapeHtml(c.uf)}</td>
            <td>${c.status==='positivado' ? '<span class="tag tag-green">positivado</span>' : '<span class="tag tag-neutral">'+escapeHtml(c.status)+'</span>'}</td>
            <td>${fmtData(c.ultima_compra)}${c.origem?' <span class="muted" style="font-size:10.5px;">('+(c.origem==='nota_fiscal'?'nota fiscal':'pedido')+')</span>':''}</td>
            <td class="num">${c.dias_sem_comprar ?? '—'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    ${clientesFiltrados.length > CLIENTES_LIMITE_PADRAO ? `
      <div style="text-align:center;margin-top:10px;">
        <button class="btn" id="btnMostrarMaisClientes">${clientesMostrarTodos ? 'Mostrar menos' : 'Mostrar todos os ' + clientesFiltrados.length}</button>
      </div>` : ''}`;
  // kpi-b2c e margem-b2c usam só o resumo enxuto — nunca precisam de
  // busca sob demanda, por isso não têm o guard "!Carregado".
  const corpoKpiB2C = `
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Pedidos parados (B2C)</div><div class="value">${contagens.pedidos_parados_b2c||0}</div></div>
      <div class="kpi"><div class="label">Parados há mais de ${dados.destaque_dias||90} dias</div><div class="value" style="color:var(--color-red);">${contagens.pedidos_parados_b2c_destaque||0}</div></div>
      <div class="kpi"><div class="label">Atende com estoque hoje</div><div class="value" style="color:var(--color-green);">${brl(projB2CResumo.valor_atende_sem_comprar)}</div></div>
      <div class="kpi"><div class="label">Depende de reposição</div><div class="value" style="color:var(--color-amber);">${brl(projB2CResumo.valor_depende_reposicao)}</div></div>
    </div>`;
  const corpoMargemB2C = `
    <div class="card">
      <p>Margem geral: <strong style="font-size:16px;">${pct(margemB2C.pct_geral)}</strong> <span class="muted">sobre ${brl(margemB2C.valor_base_calculo)} em pedidos com custo completo</span></p>
      ${margemB2C.qtd_pedidos_excluidos_sem_custo > 0 ? `<p class="tag tag-amber" style="margin-top:8px;">${margemB2C.qtd_pedidos_excluidos_sem_custo} pedido(s) com item fora da tabela de custo — excluído(s) deste cálculo</p>` : ''}
    </div>`;
  const corpoPedidosB2C = !pedidosB2CCarregado ? carregandoHtml : `
    <p class="section-sub">Em digitação + Em aberto, últimos ${dados.janela_dias||180} dias. Coluna "Estoque hoje" = comparação isolada, contra o saldo bruto (não desconta nenhum outro pedido, é só "esse pedido sozinho teria o que precisa?"). Clique num pedido pra ver os produtos.</p>
    <div class="card scroll-x">${tabelaPedidosHtml(pedidosB2C, dados.comparacao_isolado_b2c || [], 'b2c')}</div>`;
  const corpoProdutosB2C = !produtosB2CCarregado ? carregandoHtml : `
    <div class="card scroll-x">${tabelaProdutosParadosHtml(produtosB2C)}</div>`;
  const corpoComprarB2C = !projB2CCarregado ? carregandoHtml : `
    <p class="section-sub">Considerando a fila de prioridade (maior valor primeiro) esgotando o estoque atual — o B2C aloca primeiro (prioridade do canal), antes do B2B.</p>
    <div class="card scroll-x">
      <table>
        <thead><tr><th>SKU</th><th>Produto</th><th class="num">Qtd. a comprar</th><th class="num">Custo estimado</th></tr></thead>
        <tbody>
          ${(projB2C.lista_comprar||[]).length===0 ? '<tr><td colspan="4" class="muted">Nada a comprar — estoque cobre toda a carteira parada B2C.</td></tr>' :
            (projB2C.lista_comprar||[]).map(i => `<tr><td>${escapeHtml(i.sku)}</td><td>${escapeHtml(i.nome)}</td><td class="num">${i.quantidade_faltante}</td><td class="num">${brl(i.custo_estimado)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  document.getElementById('app').innerHTML = `
    <div class="nav">
      <h1>Carteira Parada — Vitanuts</h1>
      <span id="badgeVisitantes" class="badge-visitantes" style="margin-left:auto;"><span class="dot"></span>${visitantesInfo.vendo_agora} vendo agora · ${visitantesInfo.unicos} únicos</span>
      <span class="muted" style="font-size:11.5px;">Atualizado em ${new Date(dados.gerado_em).toLocaleString('pt-BR')}</span>
    </div>
    <div class="aviso">${escapeHtml(dados.aviso || 'Este relatório trata somente carteira parada (Em digitação + Em aberto). Não mostra pedidos faturados.')}</div>
    <div class="section">
      <h2 style="margin-bottom:8px;">Carteira parada por canal</h2>
      <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px;">
        <div class="kpi" style="border-color:var(--color-accent);"><div class="label">Geral</div><div class="value">${brl(cGeral.valor)}</div><div class="muted" style="font-size:11px;margin-top:2px;">${cGeral.qtd} pedidos</div></div>
        <div class="kpi"><div class="label">B2B</div><div class="value">${brl(cB2B.valor)}</div><div class="muted" style="font-size:11px;margin-top:2px;">${cB2B.qtd} pedidos</div></div>
        <div class="kpi"><div class="label">B2C</div><div class="value">${brl(cB2C.valor)}</div><div class="muted" style="font-size:11px;margin-top:2px;">${cB2C.qtd} pedidos</div></div>
      </div>
    </div>
    <div class="section">
      <h2 style="margin-bottom:8px;">Margem geral</h2>
      <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);">
        <div class="kpi"><div class="label">B2B</div><div class="value">${pct(margem.pct_geral)}</div><div class="muted" style="font-size:11px;margin-top:2px;">sobre ${brl(margem.valor_base_calculo)}</div></div>
        <div class="kpi"><div class="label">B2C</div><div class="value">${pct(margemB2C.pct_geral)}</div><div class="muted" style="font-size:11px;margin-top:2px;">sobre ${brl(margemB2C.valor_base_calculo)}</div></div>
        <div class="kpi" style="border-color:var(--color-accent);"><div class="label">Combinada (B2B + B2C)</div><div class="value">${pct(margemCombinada.pct_geral)}</div><div class="muted" style="font-size:11px;margin-top:2px;">sobre ${brl(margemCombinada.valor_base_calculo)}</div></div>
      </div>
      <p class="section-sub" style="margin-top:10px;">Combinada é ponderada pelo valor de cada canal, não a média simples dos dois percentuais.</p>
    </div>
    <div class="section">
      <h2 style="margin-bottom:8px;">Indicadores B2B</h2>
      ${corpoKpiB2B}
    </div>
    <div class="section">
      <h2 style="margin-bottom:8px;">Margem da carteira parada (B2B)</h2>
      ${corpoMargemB2B}
    </div>
    <div class="section">
      <p class="section-sub" style="margin-bottom:10px;">Clique num tópico pra ver o detalhe (a primeira vez que abre, busca os dados na hora). Do "Pedidos parados (B2B)" até "Clientes B2B — positivação" é só carteira B2B; os tópicos B2C vêm depois.</p>
      ${renderTopico('pedidos-b2b', 'Pedidos parados (B2B) — prioridade por valor', corpoPedidosB2B)}
      ${renderTopico('produtos-b2b', 'Produtos parados (B2B)', corpoProdutosB2B)}
      ${renderTopico('estoque', 'Estoque (tabela de custo)', corpoEstoque)}
      ${renderTopico('comprar-b2b', 'O que precisa comprar (B2B)', corpoComprarB2B)}
      ${renderTopico('clientes-b2b', `Clientes B2B — positivação (${dados.janela_dias||180} dias)`, corpoClientesB2B)}
      ${renderTopico('kpi-b2c', 'Indicadores B2C', corpoKpiB2C)}
      ${renderTopico('margem-b2c', 'Margem da carteira parada (B2C)', corpoMargemB2C)}
      ${renderTopico('pedidos-b2c', 'Pedidos parados (B2C) — prioridade por valor', corpoPedidosB2C)}
      ${renderTopico('produtos-b2c', 'Produtos parados (B2C)', corpoProdutosB2C)}
      ${renderTopico('comprar-b2c', 'O que precisa comprar (B2C)', corpoComprarB2C)}
    </div>
  `;
  document.getElementById('btnSalvarImposto').addEventListener('click', () => {
    const v = document.getElementById('impostoInput').value;
    atualizarImposto(v);
  });
  ligarTopicos();
  ligarExpansaoPedidos('b2b');
  ligarExpansaoPedidos('b2c');
  ligarOrdenacaoPedidos('b2b');
  ligarOrdenacaoPedidos('b2c');
  const buscaInput = document.getElementById('clientesBusca');
  if(buscaInput){
    buscaInput.addEventListener('input', (e) => {
      clientesFiltroTexto = e.target.value;
      clientesMostrarTodos = false;
      render();
      document.getElementById('clientesBusca').focus();
      document.getElementById('clientesBusca').value = clientesFiltroTexto;
      document.getElementById('clientesBusca').setSelectionRange(clientesFiltroTexto.length, clientesFiltroTexto.length);
    });
  }
  const btnMais = document.getElementById('btnMostrarMaisClientes');
  if(btnMais){
    btnMais.addEventListener('click', () => { clientesMostrarTodos = !clientesMostrarTodos; render(); });
  }
  garantirSecoesAbertasCarregadas();
}
const senhaSalva = getSenhaSalva();
if(senhaSalva){ carregarDados(senhaSalva); } else { renderLogin(false); }
</script>
</body>
</html>
